name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-s3:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_PRIMARY: ${{ vars.S3_BUCKET }}
      S3_BUCKET_SECONDARY: ${{ vars.S3_BUCKET_SECONDARY }}
      CLOUDFRONT_DISTRIBUTION_ID_PRIMARY: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_DISTRIBUTION_ID_SECONDARY: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_SECONDARY }}
      VITE_SHOPIER_PRODUCTS_ENDPOINT: ${{ vars.VITE_SHOPIER_PRODUCTS_ENDPOINT }}
      VITE_PRODUCTS_CSV_URL: ${{ vars.VITE_PRODUCTS_CSV_URL }}
      VITE_COLORS_CSV_URL: ${{ vars.VITE_COLORS_CSV_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload primary bucket under /loop
        run: |
          bucket="$(printf '%s' "$S3_BUCKET_PRIMARY" | xargs)"

          if [ -z "$bucket" ]; then
            echo "S3_BUCKET is empty, skipping primary bucket."
            exit 0
          fi

          echo "Deploying to s3://$bucket/loop"

          aws s3 sync dist/assets "s3://$bucket/loop/assets"             --delete             --cache-control "public, max-age=31536000, immutable"

          aws s3 sync dist "s3://$bucket/loop"             --delete             --exclude "assets/*"             --cache-control "no-cache"

      - name: Upload secondary bucket at root
        run: |
          bucket="$(printf '%s' "$S3_BUCKET_SECONDARY" | xargs)"

          if [ -z "$bucket" ]; then
            echo "S3_BUCKET_SECONDARY is empty, skipping secondary bucket."
            exit 0
          fi

          echo "Deploying to s3://$bucket/"

          aws s3 sync dist/assets "s3://$bucket/assets"             --delete             --cache-control "public, max-age=31536000, immutable"

          aws s3 sync dist "s3://$bucket"             --delete             --exclude "assets/*"             --cache-control "no-cache"

      - name: Invalidate primary CloudFront cache
        run: |
          distribution_id="$(printf '%s' "$CLOUDFRONT_DISTRIBUTION_ID_PRIMARY" | xargs)"

          if [ -z "$distribution_id" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID is empty, skipping primary invalidation."
            exit 0
          fi

          aws cloudfront create-invalidation             --distribution-id "$distribution_id"             --paths "/loop/*"

      - name: Invalidate secondary CloudFront cache
        run: |
          distribution_id="$(printf '%s' "$CLOUDFRONT_DISTRIBUTION_ID_SECONDARY" | xargs)"

          if [ -z "$distribution_id" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID_SECONDARY is empty, skipping secondary invalidation."
            exit 0
          fi

          aws cloudfront create-invalidation             --distribution-id "$distribution_id"             --paths "/*"
